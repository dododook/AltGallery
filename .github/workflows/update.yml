name: Update apps.json and all-apps.json

on:
  schedule:
    # Once a day at 04:00 UTC (12:00 Beijing).
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # update.sh uses `uvx altgen`
      - uses: astral-sh/setup-uv@v7

      - name: Run update.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./update.sh

      # Per-app and combined gh-proxy mirrors for users who cannot reach GitHub.
      - name: Generate proxy sources
        run: |
          set -euo pipefail
          shopt -s nullglob
          for source in apps/*/apps.json; do
            uv run tools/make_proxy.py "$source" "${source%/apps.json}/apps-proxy.json"
          done
          uv run tools/make_proxy.py all-apps.json all-apps-proxy.json

      # apps.json / all-apps.json / proxy mirrors are gitignored, so
      # `git add -A` won't pick them up. Stage them explicitly (force).
      - name: Stage generated sources
        run: git add -f all-apps.json all-apps-proxy.json apps/*/apps.json apps/*/apps-proxy.json

      - name: Check for changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update all-apps.json"
          git push origin "HEAD:${GITHUB_REF_NAME}"
