name: Build and deploy GitHub Pages

# Static catalog at https://dododook.github.io/AltGallery/
# Built from all-apps.json by tools/build_site.py.
# Deploys after the update workflow finishes so one push produces one
# Pages deployment. Bot commits use GITHUB_TOKEN and never trigger `push`.
on:
  workflow_run:
    workflows: ["Update apps.json and all-apps.json"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Build the page
        run: |
          uv run tools/build_site.py
          rm -f _site/preview.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
