# altgen config for the Frök AltStore source.
# IPA is hosted on dododook/my-ipas.
# Run: uvx altgen -c config.toml

[github]
repo = "dododook/my-ipas"

[source]
name = "Frök"
subtitle = "Frök AltStore source by AltGallery & altgen"
description = "Auto-updated AltStore source for Frök"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Frok/icon.png"
website = "https://github.com/dododook/my-ipas"
tint_color = "#4080E0"

[app]
name = "Frök"
bundle_identifier = "com.mistj.nodeseek"
developer_name = "mistj"
subtitle = "NodeSeek 第三方客户端"
description = "Frök，NodeSeek 社区的第三方 iOS 客户端。"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Frok/icon.png"
tint_color = "#4080E0"
min_os_version = "15.0"

[versions]
strip_v_prefix = true
include_prereleases = false
asset_pattern = "Frok_.*\\.ipa$"
version_pattern = "Frok_([0-9.]+)\\.ipa$"
version_source = "filename"

[news]
title_template = "{name} {version} · {date}"
image_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Frok/images/news.png"

[output]
path = "apps.json"
