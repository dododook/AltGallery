# altgen config for the MeloX AltStore source.
# Run: uvx altgen -c config.toml

[github]
repo = "youshen2/MeloX"

[source]
name = "MeloX"
subtitle = "MeloX AltStore source by AltGallery & altgen"
description = "Auto-updated AltStore source for MeloX"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/MeloX/icon.png"
website = "https://github.com/youshen2/MeloX"
tint_color = "#F02030"

[app]
name = "MeloX"
bundle_identifier = "azki.moye.MeloX"
developer_name = "youshen2"
subtitle = "原生第三方网易云音乐客户端"
description = "MeloX，原生 SwiftUI 第三方网易云音乐客户端，参考 Apple Music 界面，支持逐字歌词、下载与多端。"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/MeloX/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/MeloX/images/home.png",
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/MeloX/images/library.png",
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/MeloX/images/player.png",
]
tint_color = "#F02030"
min_os_version = "26.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# iOS IPA only; ignore macOS DMG / zip assets on other tags.
asset_pattern = "MeloX-iOS-unsigned\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
image_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/MeloX/images/news.png"

[output]
path = "apps.json"
