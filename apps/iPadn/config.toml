# altgen config for the iPadn AltStore source.
# Run: uvx altgen -c config.toml
# No project AltStore source; fields taken from README, build-info.json, and IPA Info.plist.

[github]
repo = "mengangs/ipadn"

[source]
name = "iPadn"
subtitle = "iPadn AltStore source by AltGallery & altgen"
description = "Auto-updated AltStore source for iPadn"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/iPadn/icon.png"
website = "https://github.com/mengangs/ipadn"
tint_color = "#111111"

[app]
name = "iPadn"
bundle_identifier = "app.local.iPadn"
developer_name = "mengangs"
subtitle = "搜索、下载你拥有的 App"
description = "iPadn，开源 App Store 客户端。用你自己的 Apple 账号搜索、下载并安装已购应用，支持历史版本、已下架应用、多地区比价与一键安装。发布的安装包未签名，需自行签名。"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/iPadn/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/iPadn/images/search.jpg",
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/iPadn/images/detail.jpg",
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/iPadn/images/versions.jpg",
]
tint_color = "#111111"
min_os_version = "17.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Releases ship iPadn-X.Y.Z-unsigned.ipa plus a .sha256 sidecar.
asset_pattern = "iPadn-.*-unsigned\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
image_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/iPadn/images/news.png"

[output]
path = "apps.json"
