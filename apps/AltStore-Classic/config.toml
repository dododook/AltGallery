# altgen config for the AltStore Classic AltStore source.
# IPA is hosted on dododook/my-ipas.
# Run: uvx altgen -c config.toml

[github]
repo = "dododook/my-ipas"

[source]
name = "AltStore Classic"
subtitle = "AltStore Classic AltStore source by AltGallery & altgen"
description = "Auto-updated AltStore source for AltStore Classic"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/AltStore-Classic/icon.png"
website = "https://altstore.io"
tint_color = "#018084"

[app]
name = "AltStore Classic"
bundle_identifier = "com.rileytestut.AltStore.Beta"
developer_name = "Riley Testut"
subtitle = "无需越狱的第三方 App Store"
description = "AltStore Classic，Riley Testut 的官方侧载商店。可用 Apple ID 签名并安装 IPA，2.3 起支持远程 AltServer、无需电脑常开刷新。"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/AltStore-Classic/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/AltStore-Classic/images/browse.png",
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/AltStore-Classic/images/apps.png",
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/AltStore-Classic/images/sources.png",
]
tint_color = "#018084"
min_os_version = "17.4"

[versions]
strip_v_prefix = true
include_prereleases = false
# Only the AltStore Classic IPA in dododook/my-ipas; other apps in that repo are ignored.
asset_pattern = "AltStoreClassic_.*\\.ipa$"
version_pattern = "AltStoreClassic_([0-9.b]+)\\.ipa$"
version_source = "filename"

[news]
title_template = "{name} {version} · {date}"
image_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/AltStore-Classic/images/news.png"

[output]
path = "apps.json"
