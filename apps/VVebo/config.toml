# altgen config for the VVebo AltStore source.
# IPA is hosted on dododook/my-ipas.
# Run: uvx altgen -c config.toml

[github]
repo = "dododook/my-ipas"

[source]
name = "VVebo"
subtitle = "VVebo AltStore source by AltGallery & altgen"
description = "Auto-updated AltStore source for VVebo"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/VVebo/icon.png"
website = "https://github.com/dododook/my-ipas"
tint_color = "#F5C400"

[app]
name = "VVebo"
bundle_identifier = "com.johnil.vvebo"
developer_name = "johnil"
subtitle = "已停更的第三方微博客户端"
description = "VVebo 3.3.31 适配版。已停更的第三方微博客户端，含较新系统上的兼容补丁。请先卸掉旧的巨魔包或旧自签包再装。"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/VVebo/icon.png"
tint_color = "#F5C400"
min_os_version = "14.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Only the VVebo IPA in dododook/my-ipas; other apps in that repo are ignored.
# Filename version is bumped (3.3.31.1) because Info.plist stays at 3.3.31.
asset_pattern = "VVebo_.*\\.ipa$"
version_pattern = "VVebo_([0-9.]+)\\.ipa$"
version_source = "filename"

[news]
title_template = "{name} {version} · {date}"
image_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/VVebo/images/news.png"

[output]
path = "apps.json"
