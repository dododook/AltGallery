# altgen config for the Kumone AltStore source.
# IPA is the unsigned iOS build on missuo/kumone GitHub Releases.
# Run: uvx altgen -c config.toml

[github]
repo = "missuo/kumone"

[source]
name = "Kumone"
subtitle = "Kumone AltStore source by AltGallery & altgen"
description = "Auto-updated AltStore source for Kumone"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Kumone/icon.png"
website = "https://github.com/missuo/kumone"
tint_color = "#C9A227"

[app]
name = "Kumone"
bundle_identifier = "sb.moe.kumone"
developer_name = "missuo"
subtitle = "第三方网易云音乐客户端"
description = "Kumone（雲の音），网易云音乐的原生第三方客户端。每个 GitHub Release 附带未签名 iOS IPA。"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Kumone/icon.png"
tint_color = "#C9A227"
min_os_version = "16.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Releases also ship a macOS .zip; only take the unsigned iOS IPA.
asset_pattern = "Kumone-iOS-.*\\.ipa$"

[news]
title_template = "{name} {version} · {date}"
image_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Kumone/images/news.png"

[output]
path = "apps.json"
