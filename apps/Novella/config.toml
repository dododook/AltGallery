# altgen config for the Novella AltStore source.
# IPA is hosted on dododook/my-ipas. celia-sh/Novella is archived and
# dropped its GitHub Release IPA assets.
# Run: uvx altgen -c config.toml

[github]
repo = "dododook/my-ipas"

[source]
name = "Novella"
subtitle = "Novella AltStore source by AltGallery & altgen"
description = "Auto-updated AltStore source for Novella"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Novella/icon.png"
website = "https://github.com/celia-sh/Novella"
tint_color = "#2E2E2E"

[app]
name = "Novella"
bundle_identifier = "sh.celia.novella"
developer_name = "CELIA"
subtitle = "轻书架第三方客户端"
description = "使用 React Native 构建的轻书架第三方客户端，面向 iOS、iPadOS。上游仓库已归档并撤掉 IPA，本源保留 v2.7.0 未签名包。"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Novella/icon.png"
screenshots = [
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Novella/images/home.png",
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Novella/images/shelf.png",
  "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Novella/images/detail.png",
]
tint_color = "#2E2E2E"
min_os_version = "16.4"

[versions]
strip_v_prefix = true
include_prereleases = false
# Only the Novella IPA in dododook/my-ipas; other apps in that repo are ignored.
asset_pattern = "Novella_.*\\.ipa$"
version_pattern = "Novella_([0-9.]+)\\.ipa$"
version_source = "filename"

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by templates/render_news.py
image_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Novella/images/news.png"

[output]
path = "apps.json"
