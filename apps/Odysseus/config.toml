# altgen config for the Odysseus AltStore source.
# IPA is hosted on dododook/my-ipas (upstream has no v1.0.0 asset yet).
# Metadata taken from the project's app-repo.json.
# Run: uvx altgen -c config.toml

[github]
repo = "dododook/my-ipas"

[source]
name = "Odysseus"
subtitle = "Odysseus AltStore source by AltGallery & altgen"
description = "Auto-updated AltStore source for Odysseus"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Odysseus/icon.png"
website = "https://github.com/mirazbakis/Odysseus"
tint_color = "#B8CCF0"

[app]
name = "Odysseus"
bundle_identifier = "com.mirazbakis.Odysseus"
developer_name = "mbakis"
subtitle = "Your sources. Your certificate. Your apps."
description = "Odysseus，基于 Feather 与 FreeSign 的本机签名商店。把各个源的应用收进一个目录，用自己的证书或 Apple ID 签名并安装。"
icon_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Odysseus/icon.png"
tint_color = "#B8CCF0"
min_os_version = "17.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Only the Odysseus IPA in dododook/my-ipas; other apps in that repo are ignored.
asset_pattern = "Odysseus_.*\\.ipa$"
version_pattern = "Odysseus_([0-9.]+)\\.ipa$"
version_source = "filename"

[news]
title_template = "{name} {version} · {date}"
image_url = "https://raw.githubusercontent.com/dododook/AltGallery/refs/heads/master/apps/Odysseus/images/news.png"

[output]
path = "apps.json"
